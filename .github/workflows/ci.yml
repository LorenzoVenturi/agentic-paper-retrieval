name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build distribution
        run: |
          python -m pip install build
          python -m build
      - name: Install and check the built wheel
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install dist/*.whl
          .ci-venv/bin/paper-retriever --version
          .ci-venv/bin/paper-retriever --help
          .ci-venv/bin/paper-retriever refine --help
          .ci-venv/bin/paper-retriever ui --help
          .ci-venv/bin/python -m agentic_paper_retrieval --version
      - name: Run offline behavioral tests
        env:
          LANGGRAPH_STRICT_MSGPACK: "true"
        run: .ci-venv/bin/python -m unittest discover -s tests -v
